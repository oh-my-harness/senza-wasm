name: pages

# 把 demo 部署到 GitHub Pages：
#   https://<user>.github.io/senza-wasm/demo/
# 触发：main 分支 push（demo/ 或 src/ 有变更时）或手动。
# wasm 产物不进 git —— Pages 部署在 CI 里现构建。

on:
  push:
    branches: [main]
    paths: ["demo/**", "src/**", "Cargo.toml", ".github/workflows/pages.yml"]
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 内核依赖 llm-harness-runtime（私有）—— PAT 拉取（同 Folumi 模式）
      - name: Configure private Git dependencies
        env:
          PRIVATE_DEPS_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${PRIVATE_DEPS_TOKEN:-}" ]]; then
            echo "::error title=Missing PRIVATE_DEPS_TOKEN::Create a repository secret named PRIVATE_DEPS_TOKEN with read access to private git dependencies such as oh-my-harness/llm-harness-runtime."
            exit 1
          fi
          echo "::add-mask::${PRIVATE_DEPS_TOKEN}"
          git config --global url."https://x-access-token:${PRIVATE_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-pack --locked
      - run: wasm-pack build --target web --out-dir pkg-web
      - name: assemble site
        run: |
          cp -r demo _site_demo
          mkdir -p _site
          mv _site_demo _site/demo
          cp -r pkg-web _site/pkg-web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
