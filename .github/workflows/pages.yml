name: pages

# 把 demo 部署到 GitHub Pages：
#   https://<user>.github.io/senza-wasm/demo/
# 触发：main 分支 push（demo/ 或 src/ 有变更时）或手动。
# wasm 产物不进 git —— Pages 部署在 CI 里现构建。

on:
  push:
    branches: [main]
    paths: ["demo/**", "src/**", "Cargo.toml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 内核依赖 llm-harness-runtime（私有）—— 用 GITHUB_TOKEN 拉取
      - run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-pack --locked
      - run: wasm-pack build --target web --out-dir pkg-web
      - name: assemble site
        run: |
          mkdir -p _site/demo
          cp -r demo/index.html _site/demo/
          cp -r pkg-web _site/pkg-web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
