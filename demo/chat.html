<!doctype html>
<!--
  senza-wasm browser demo — 一个页面里的本地 agent。

  单 HTML + 工具 + 审批门 + 成本快照，纯前端跑完整 agent loop。
  直连任意 OpenAI 兼容 API（官方 / DeepSeek / Moonshot / Ollama …）；
  key 只在浏览器内存里，刷新即失；生产应走网关代理。

  Run:
    wasm-pack build --target web --out-dir pkg-web
    python3 -m http.server 8931    # from repo root
    open http://localhost:8931/demo/index.html
-->

  /* ---------- markdown ---------- */
  .md { line-height: 1.7; }

<script type="module">
import init, { EmbeddedAgent } from "../pkg-web/senza_wasm.js";
import { bindSettings, providerOpts } from "./common.js";

const $ = (id) => document.getElementById(id);
const chat = $("chat");

await init(); // web target: fetch + instantiate

// ---------- UI helpers ----------
function addMsg(cls, who, bodyText, opts = {}) {
  const div = document.createElement("div");
  div.className = `msg ${cls}`;
  const whoEl = document.createElement("div"); whoEl.className = "who"; whoEl.textContent = who;
  const body = document.createElement("div"); body.className = "body";
  if (opts.html) body.innerHTML = bodyText; else body.textContent = bodyText;
  div.append(whoEl, body);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return body;
}
const status = (s) => { $("statusline").textContent = s; };
const busyEl = () => { const b = addMsg("assistant", "assistant", ""); 
  const c = document.createElement("span"); c.className = "cursor"; b.appendChild(c); return b; };

// ---------- markdown ----------
// 零依赖小渲染器（够 demo 用；块级 + 行内 + fenced code，输出安全 HTML）
function esc(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function inlineMd(s) {
  // `code`、**bold**、*italic*、~~del~~、[t](url)、autolink、数学 —— 顺序敏感
  let out = "", i = 0, rest = esc(s);
  const re = /(`[^`\n]+`)|(\*\*[^*]+\*\*)|(~~[^~]+~~)|(\*[^*\s][^*]*\*)|(\[([^\]]+)\]\(([^)\s]+)\))|(https?:\/\/[^\s<>)]+)/g;
  // 逐段：先按 `code` 切分（code 内不解析其余标记），其余段跑行内规则
  const parts = rest.split(/(`[^`]+`)/g);
  for (const p of parts) {
    if (p.startsWith("`") && p.endsWith("`") && p.length > 2) { out += "<code>" + p.slice(1, -1) + "</code>"; continue; }
    out += renderInlineMath(p
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
      .replace(/~~([^~]+)~~/g, "<del>$1</del>")
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|[\s(])((?:https?:\/\/)[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>'));
  }
  return out;
}
// 行内数学：$..$ 与 \(..\)。display 数学（$$..$$ / \[..\]，可跨行）在
// mdToHtml 的 flushP 里对整段跑 —— 单行处理永远见不到闭合定界符。
function renderInlineMath(html) {
  if (typeof katex === "undefined") return html;  // KaTeX 未就绪：留原文，定稿时重渲染
  return html.replace(
    /(\$[^\s$][^\n$]*?\$)|(\\\(([\s\S]+?)\\\))/g,
    (m, d, pl, plainP) => {
      let tex;
      if (d) {
        // 货币误判防护：$5$ 这种两侧紧贴数字的当钱处理；首尾去空白
        tex = d.slice(1, -1);
        if (/^\d[\d.,\s]*\d$|^\d$/.test(tex.trim())) return m;
      } else tex = plainP;
      if (!tex.trim()) return m;
      try {
        return katex.renderToString(unescapeMd(tex), { throwOnError: false });
      } catch { return m; }
    });
}
// display 数学：$$..$$ 与 \[..\]，可跨行。inlineMd 已逐行处理过行内标记，
// 这里对拼接后的整段跑（<br> 由换行而来，出现在定界符间不影响 TeX 源）；
// <code> 段已由 inlineMd 定型，跳过以免 code 内的 $ 被误吃。
function renderDisplayMath(html) {
  if (typeof katex === "undefined") return html;
  const render = (s) => s.replace(
    /(\$\$([\s\S]+?)\$\$)|(\\\[([\s\S]+?)\\\])/g,
    (m, dd, plainD, br, plainB) => {
      const tex = (plainD != null ? plainD : plainB).replace(/<br\s*\/?>/g, "\n");
      if (!tex.trim()) return m;
      try {
        return katex.renderToString(unescapeMd(tex), { displayMode: true, throwOnError: false });
      } catch { return m; }
    });
  return html.split(/(<code>[\s\S]*?<\/code>)/g).map(
    (p) => p.startsWith("<code>") ? p : render(p)).join("");
}
// esc() 转义过的实体还原回 TeX 源码
function unescapeMd(s) {
  return s.replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
          .replace(/&quot;/g, '"').replace(/&#39;/g, "'");
}
function mdToHtml(src) {
  const lines = src.replace(/\r\n?/g, "\n").split("\n");
  let html = "", i = 0;
  // 段落先整体跑 display 数学（$$..$$ / \[..\] 可跨行），再逐行过行内规则
  const flushP = (buf) => {
    if (!buf.length) return;
    html += "<p>" + renderDisplayMath(buf.map(inlineMd).join("<br>")) + "</p>";
  };
  let para = [];
  while (i < lines.length) {
    const L = lines[i];
    if (/^```/.test(L)) {                              // fenced code
      flushP(para); para = [];
      const m = L.slice(3).trim(); i++;
      let code = [];
      while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
      i++;                                              // 跳过结束 ```
      html += "<pre><code" + (m ? ' class="lang-' + m + '"' : "") + ">" + esc(code.join("\n")) + "</code></pre>";
    } else if (/^(#{1,4})\s+(.*)/.test(L)) {           // heading
      flushP(para); para = [];
      const m = L.match(/^(#{1,4})\s+(.*)/);
      html += "<h" + m[1].length + ">" + inlineMd(m[2]) + "</h" + m[1].length + ">";
      i++;
    } else if (/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(L)) {  // hr
      flushP(para); para = [];
      html += "<hr/>"; i++;
    } else if (/^>\s?/.test(L)) {                      // blockquote
      flushP(para); para = [];
      const q = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, ""));
      html += "<blockquote>" + mdToHtml(q.join("\n")) + "</blockquote>";
    } else if (/^\s*([-+*]|\d+[.)])\s+/.test(L)) {   // list
      flushP(para); para = [];
      const ordered = /^\s*\d/.test(L);
      let items = [];
      while (i < lines.length && /^\s*([-+*]|\d+[.)])\s+/.test(lines[i])) {
        let item = lines[i++].replace(/^\s*([-+*]|\d+[.)])\s+/, "");
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-+*]|\d+[.)])\s+/.test(lines[i]))
          item += " " + lines[i++].replace(/^\s+/, "");   // 续行
        items.push(item);
      }
      html += "<" + (ordered ? "ol" : "ul") + ">" + items.map((t) => "<li>" + inlineMd(t) + "</li>").join("") + "</" + (ordered ? "ol" : "ul") + ">";
    } else if (/^\|.*\|$/.test(L) && i + 1 < lines.length && /^\|[\s:|-]+$/.test(lines[i + 1])) {  // table
      flushP(para); para = [];
      const head = splitRow(lines[i]);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\|.*\|$/.test(lines[i])) rows.push(splitRow(lines[i++]));
      html += "<table><thead><tr>" + head.map((h) => "<th>" + inlineMd(h) + "</th>").join("") +
        "</tr></thead><tbody>" +
        rows.map((r) => "<tr>" + r.map((c) => "<td>" + inlineMd(c) + "</td>").join("") + "</tr>").join("") +
        "</tbody></table>";
    } else if (!L.trim()) {                             // 空行 = 段落边界
      flushP(para); para = [];
      i++;
    } else {
      para.push(L); i++;
    }
  }
  flushP(para);
  return html;
}
function splitRow(l) { return l.replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim()); }
// 流式期间节流渲染（markdown 半成品常呈现为普通段落，收尾 message_end 定稿）
function renderMarkdownLive(body, buf) {
  body.classList.add("md");
  if (renderMarkdownLive._t) return void (renderMarkdownLive._b = [body, buf]);
  renderMarkdownLive._t = setTimeout(() => {
    renderMarkdownLive._t = null;
    const [b, s] = renderMarkdownLive._b || [];
    if (b && b.isConnected) b.innerHTML = mdToHtml(s);
  }, 120);
}

// ---------- agent ----------
let agent = null;
let currentAssistantBody = null;
let streamBuf = "";

function makeAgent() {
  const opts = providerOpts({
    systemPrompt: "你是一个简洁的中文助手。需要当前时间就调 fetchTime 工具；要保存内容必须调 writeNote 工具（会经用户审批）。",
  });
  const a = new EmbeddedAgent(JSON.stringify(opts));

  // 工具 1：查时间 —— 自动执行
  a.registerTool("fetchTime", "获取当前本地时间", JSON.stringify({ type: "object" }),
    async () => JSON.stringify({ text: new Date().toLocaleString("zh-CN") }));

  // 工具 2：写笔记 —— 审批门（manual）
  a.registerToolWithOptions("writeNote", "把一条笔记写入浏览器 localStorage（危险操作，需人工确认）",
    JSON.stringify({ type: "object", properties: { text: { type: "string" } }, required: ["text"] }),
    async (argsJson) => {
      const { text } = JSON.parse(argsJson);
      localStorage.setItem("senza-demo-note", text);
      return JSON.stringify({ text: "saved: " + text });
    },
    JSON.stringify({ approval: "manual" }));

  return a;
}

// ---------- event pump ----------
// agentActive：agent_start 置位，agent_end 清零；pump 轮询 poll() 直到排空
let agentActive = false;
async function pump() {
  for (;;) {
    await new Promise((r) => setTimeout(r, 40));
    const lines = agent.poll();
    for (const line of lines) handleEvent(JSON.parse(line));
    if (!lines.length && !agentActive) break;
  }
}

function handleEvent(ev) {
  switch (ev.type) {
    case "agent_start":
      agentActive = true;
      status("agent running…");
      currentAssistantBody = busyEl();
      break;
    case "message_start":
      // 每条 assistant 消息一个气泡（一轮 run 可能有多条：工具轮之后的收尾轮）
      if (currentAssistantBody) currentAssistantBody.querySelector?.(".cursor")?.remove();
      streamBuf = "";
      currentAssistantBody = busyEl();
      break;
    case "text_delta":
      if (currentAssistantBody) {
        streamBuf += ev.text;
        renderMarkdownLive(currentAssistantBody, streamBuf);
        chat.scrollTop = chat.scrollHeight;
      }
      break;
    case "tool_execution_start": {
      // 审批门：writeNote 需要人工确认
      if (ev.tool_name === "writeNote") {
        addMsg("toolcall", "tool call", `→ ${ev.tool_name}(${ev.args ?? ""})`);
        const body = addMsg("approval", "⚠ 审批",
          `模型想执行 ${ev.tool_name}。放行？`);
        const yes = document.createElement("button"); yes.textContent = "放行"; yes.style.marginRight = ".5rem";
        const no = document.createElement("button"); no.textContent = "拒绝"; no.className = "ghost";
        body.append(yes, no);
        const decide = (allow) => {
          yes.disabled = no.disabled = true;
          agent.approveToolCall(ev.tool_use_id, allow);
          body.append(` —— ${allow ? "已放行" : "已拒绝（LLM 会看到 denied_by_host）"}`);
        };
        yes.onclick = () => decide(true);
        no.onclick = () => decide(false);
      } else {
        addMsg("toolcall", "tool call", `→ ${ev.tool_name}(${ev.args ?? ""})`);
      }
      break;
    }
    case "tool_execution_end": {
      const text = ev.ok
        ? "✓ " + (ev.result?.text ?? JSON.stringify(ev.result))
        : "✗ " + (ev.error ?? "failed");
      addMsg("toolresult", "tool result", text);
      break;
    }
    case "message_end":
      if (currentAssistantBody) {
        const finalize = () => {
          currentAssistantBody.classList.add("md");
          currentAssistantBody.innerHTML = mdToHtml(streamBuf);
        };
        if (typeof katex !== "undefined") finalize();
        else { // KaTeX 还在路上：等加载完再定稿（3s 超时兜底）
          const t = setInterval(() => {
            if (typeof katex !== "undefined" || (Date.now() - _t0 > 3000)) {
              clearInterval(t); finalize();
            }
          }, 100);
          const _t0 = Date.now();
        }
        currentAssistantBody = null;
      }
      break;
    case "agent_end":
      agentActive = false;
      status("idle");
      updateCost();
      break;
    case "error":
      addMsg("error", "error", `${ev.error_type ?? ""}: ${ev.message ?? JSON.stringify(ev)}`);
      break;
  }
}

function updateCost() {
  const c = JSON.parse(agent.costSnapshot());
  const rows = [
    ["input tokens", c.totalInputTokens], ["output tokens", c.totalOutputTokens],
    ["cache read", c.totalCacheReadTokens], ["cache write", c.totalCacheWriteTokens],
    ["reasoning", c.totalReasoningTokens], ["provider calls", c.providerCalls],
  ];
  $("cost").innerHTML = rows.map(([k, v]) =>
    `<tr><td>${k}</td><td class="costcell">${v ?? 0}</td></tr>`).join("");
}

// ---------- wiring ----------
// 移动端抽屉
$("gear").onclick = () => document.querySelector("aside").classList.toggle("open");
document.addEventListener("click", (e) => {
  const aside = document.querySelector("aside");
  if (aside.classList.contains("open")
      && !aside.contains(e.target) && e.target.id !== "gear")
    aside.classList.remove("open");
});
// API 配置一次全 demo 共享（localStorage）；变更后重建 agent
bindSettings({ preset: "preset", baseurl: "baseurl", apikey: "apikey", model: "model" },
  () => { agent = null; });

let lastSessionJson = null;
function ensureAgent() {
  if (!agent) {
    const keep = agent === null && lastSessionJson; // 首条消息时无历史可带
    agent = makeAgent();
    // 配置变更重建时，把旧会话历史迁过来（换模型续聊）
    if (lastSessionJson) { try { agent.importSession(lastSessionJson); } catch (e) { /* 版本不符则重开 */ } }
  }
  return agent;
}
setInterval(() => { if (agent) lastSessionJson = agent.exportSession(); }, 3000);

$("inputbar").onsubmit = (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text) return;
  try {
    ensureAgent();
  } catch (err) {
    addMsg("error", "error", String(err.message ?? err));
    return;
  }
  $("input").value = "";
  addMsg("user", "you", text);
  agent.prompt(text);
  pump();
};
$("input").onkeydown = (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("inputbar").requestSubmit(); }
};

$("export").onclick = () => {
  const blob = new Blob([agent ? agent.exportSession() : '{"v":1,"history":[]}'], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "senza-session.json"; a.click();
};
$("import").onclick = async () => {
  const f = document.createElement("input"); f.type = "file"; f.accept = ".json";
  f.onchange = async () => {
    const text = await f.files[0].text();
    ensureAgent().importSession(text);
    addMsg("assistant", "system", `已导入 ${JSON.parse(text).history.length} 条历史。`);
  };
  f.click();
};
$("clear").onclick = () => { if (agent) { agent.clearSession(); addMsg("assistant", "system", "会话已清空（成本累计保留）。"); } };

addMsg("assistant", "system",
  '已就绪。填好 API 端点和 key 即可对话；模型可调 fetchTime（自动执行）和 writeNote（弹审批、写 localStorage）。\n换端点/模型会保留聊天记录接着聊。');
</script>
