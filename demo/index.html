<!doctype html>
<!--
  senza-wasm browser demo — 一个页面里的本地 agent。

  单 HTML + 工具 + 审批门 + 成本快照，纯前端跑完整 agent loop。
  默认 mock provider（不花 API 费）；填入真实 openai key 可切真模型
  （key 只在浏览器内存里，刷新即失；生产应走网关代理）。

  Run:
    wasm-pack build --target web --out-dir pkg-web
    python3 -m http.server 8931    # from repo root
    open http://localhost:8931/demo/index.html
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>senza-wasm · browser agent</title>
<style>
  * { box-sizing: border-box; }
  body { font: 14px/1.6 -apple-system, "PingFang SC", sans-serif; margin: 0;
         background: #0f1117; color: #d7dae0; display: flex; height: 100vh; }
  aside { width: 300px; padding: 1rem 1.25rem; background: #161a23;
          border-right: 1px solid #262b36; overflow-y: auto; flex-shrink: 0; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chat { flex: 1; overflow-y: auto; padding: 1.5rem 2rem; }
  #inputbar { display: flex; gap: .5rem; padding: 1rem 2rem; border-top: 1px solid #262b36; }
  h1 { font-size: 1rem; margin: 0 0 1rem; color: #fff; }
  h1 small { color: #7d8590; font-weight: normal; }
  fieldset { border: 1px solid #262b36; border-radius: 8px; margin: 0 0 1rem; padding: .6rem .8rem .8rem; }
  legend { font-size: .75rem; color: #7d8590; padding: 0 .3rem; }
  label { display: block; font-size: .75rem; color: #9aa3b0; margin: .35rem 0 .15rem; }
  input, select, textarea { width: 100%; font: inherit; background: #0f1117; color: #d7dae0;
         border: 1px solid #323949; border-radius: 6px; padding: .35rem .5rem; }
  textarea { resize: vertical; min-height: 3.2em; }
  button { font: inherit; background: #2d6cdf; color: #fff; border: 0; border-radius: 6px;
           padding: .45rem 1rem; cursor: pointer; }
  button:disabled { background: #323949; cursor: not-allowed; }
  button.ghost { background: #323949; }
  #send { flex-shrink: 0; }
  .msg { max-width: 72ch; margin: 0 auto 1.1rem; }
  .msg.user .body { background: #233043; }
  .msg.assistant .body { background: #1b2029; }
  .msg.toolcall { font-family: ui-monospace, monospace; font-size: .8rem; }
  .msg.toolcall .body { background: #141a15; border: 1px dashed #2e4a33; color: #9fc7a4; }
  .msg.toolresult .body { font-family: ui-monospace, monospace; font-size: .8rem;
                          background: #141a15; border: 1px solid #2e4a33; color: #8fae94; }
  .msg.approval .body { background: #2b2313; border: 1px solid #6b5518; color: #e5c76b; }
  .msg.error .body { background: #2b1313; border: 1px solid #6b1818; color: #e58c8c; }
  .cursor { display: inline-block; width: .55em; height: 1em; background: #7d8590;
            vertical-align: text-bottom; animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #statusline { font-size: .75rem; color: #7d8590; padding: 0 2rem .6rem; }
  .badge { display: inline-block; background: #232b3a; border-radius: 4px; padding: 0 .4rem;
           margin-left: .5rem; font-size: .7rem; color: #9aa3b0; }
  .costcell { font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-size: .75rem; }
  td { padding: .15rem 0; border-bottom: 1px solid #20242e; }
  td:last-child { text-align: right; color: #cdd4de; }
</style>
</head>
<body>
<aside>
  <h1>senza-wasm <small>· browser agent</small></h1>
  <fieldset>
    <legend>provider</legend>
    <label>模式</label>
    <select id="mode">
      <option value="mock" selected>mock（确定性剧本，不花钱）</option>
      <option value="openai">openai（真实模型）</option>
    </select>
    <div id="openai-box" style="display:none">
      <label>API key（仅存于页面内存）</label>
      <input id="apikey" type="password" placeholder="sk-…" />
      <label>model</label>
      <input id="model" value="gpt-4o-mini" />
    </div>
    <label>mock 剧本（mock 模式下循环播放）</label>
    <textarea id="script">
[
  { "kind": "tool_use", "toolUseId": "d1", "name": "fetchTime", "args": "{}" },
  { "kind": "tool_use", "toolUseId": "d2", "name": "writeNote", "args": "{\"text\":\"hello world\"}" },
  { "kind": "text", "text": "已查询时间并保存笔记（被审批门拦过一次）。" }
]
    </textarea>
  </fieldset>
  <fieldset>
    <legend>会话</legend>
    <button class="ghost" id="export">导出 session JSON</button>
    <button class="ghost" id="import">导入</button>
    <button class="ghost" id="clear">清空</button>
    <p style="font-size:.7rem;color:#7d8590;margin:.6rem 0 0">
      session 由页面持有；导出的 JSON 可存下来换浏览器续聊。
    </p>
  </fieldset>
  <fieldset>
    <legend>成本（本次页面生命周期）</legend>
    <table id="cost"><tr><td>尚无调用</td><td></td></tr></table>
  </fieldset>
  <p style="font-size:.7rem;color:#7d8590">
    内置工具：<code>fetchTime</code>（自动放行）·
    <code>writeNote</code>（审批门，写入 localStorage）
  </p>
</aside>
<main>
  <div id="chat"></div>
  <div id="statusline">idle</div>
  <form id="inputbar">
    <textarea id="input" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="send" type="submit">发送</button>
  </form>
</main>

<script type="module">
import init, { EmbeddedAgent } from "../pkg-web/senza_wasm.js";

const $ = (id) => document.getElementById(id);
const chat = $("chat");

await init(); // web target: fetch + instantiate

// ---------- UI helpers ----------
function addMsg(cls, who, bodyText, opts = {}) {
  const div = document.createElement("div");
  div.className = `msg ${cls}`;
  const whoEl = document.createElement("div"); whoEl.className = "who"; whoEl.textContent = who;
  const body = document.createElement("div"); body.className = "body";
  if (opts.html) body.innerHTML = bodyText; else body.textContent = bodyText;
  div.append(whoEl, body);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return body;
}
const status = (s) => { $("statusline").textContent = s; };
const busyEl = () => { const b = addMsg("assistant", "assistant", ""); 
  const c = document.createElement("span"); c.className = "cursor"; b.appendChild(c); return b; };

// ---------- agent ----------
let agent = null;
let currentAssistantBody = null;

function makeAgent() {
  const mock = $("mode").value === "mock";
  const opts = mock
    ? { provider: "mock", model: "mock-model", mockScript: JSON.parse($("script").value) }
    : { provider: "openai", apiKey: $("apikey").value, model: $("model").value,
        systemPrompt: "你是一个简洁的中文助手。需要时间就调 fetchTime，要保存内容必须调 writeNote。" };
  const a = new EmbeddedAgent(JSON.stringify(opts));

  // 工具 1：查时间 —— 自动执行
  a.registerTool("fetchTime", "获取当前本地时间", JSON.stringify({ type: "object" }),
    async () => JSON.stringify({ text: new Date().toLocaleString("zh-CN") }));

  // 工具 2：写笔记 —— 审批门（manual）
  a.registerToolWithOptions("writeNote", "把一条笔记写入浏览器 localStorage（危险操作，需人工确认）",
    JSON.stringify({ type: "object", properties: { text: { type: "string" } }, required: ["text"] }),
    async (argsJson) => {
      const { text } = JSON.parse(argsJson);
      localStorage.setItem("senza-demo-note", text);
      return JSON.stringify({ text: "saved: " + text });
    },
    JSON.stringify({ approval: "manual" }));

  return a;
}

// ---------- event pump ----------
// agentActive：agent_start 置位，agent_end 清零；pump 轮询 poll() 直到排空
let agentActive = false;
async function pump() {
  for (;;) {
    await new Promise((r) => setTimeout(r, 40));
    const lines = agent.poll();
    for (const line of lines) handleEvent(JSON.parse(line));
    if (!lines.length && !agentActive) break;
  }
}

function handleEvent(ev) {
  switch (ev.type) {
    case "agent_start":
      agentActive = true;
      status("agent running…");
      currentAssistantBody = busyEl();
      break;
    case "message_start":
      // 每条 assistant 消息一个气泡（一轮 run 可能有多条：工具轮之后的收尾轮）
      if (currentAssistantBody) currentAssistantBody.querySelector?.(".cursor")?.remove();
      currentAssistantBody = busyEl();
      break;
    case "text_delta":
      if (currentAssistantBody) {
        currentAssistantBody.lastChild?.classList?.remove("cursor");
        currentAssistantBody.append(ev.text);
        chat.scrollTop = chat.scrollHeight;
      }
      break;
    case "tool_execution_start": {
      // 审批门：writeNote 需要人工确认
      if (ev.tool_name === "writeNote") {
        addMsg("toolcall", "tool call", `→ ${ev.tool_name}(${ev.args ?? ""})`);
        const body = addMsg("approval", "⚠ 审批",
          `模型想执行 ${ev.tool_name}。放行？`);
        const yes = document.createElement("button"); yes.textContent = "放行"; yes.style.marginRight = ".5rem";
        const no = document.createElement("button"); no.textContent = "拒绝"; no.className = "ghost";
        body.append(yes, no);
        const decide = (allow) => {
          yes.disabled = no.disabled = true;
          agent.approveToolCall(ev.tool_use_id, allow);
          body.append(` —— ${allow ? "已放行" : "已拒绝（LLM 会看到 denied_by_host）"}`);
        };
        yes.onclick = () => decide(true);
        no.onclick = () => decide(false);
      } else {
        addMsg("toolcall", "tool call", `→ ${ev.tool_name}(${ev.args ?? ""})`);
      }
      break;
    }
    case "tool_execution_end": {
      const text = ev.ok
        ? "✓ " + (ev.result?.text ?? JSON.stringify(ev.result))
        : "✗ " + (ev.error ?? "failed");
      addMsg("toolresult", "tool result", text);
      break;
    }
    case "message_end":
      if (currentAssistantBody) {
        currentAssistantBody.lastChild?.classList?.remove("cursor");
        currentAssistantBody = null;
      }
      break;
    case "agent_end":
      agentActive = false;
      status("idle");
      updateCost();
      break;
    case "error":
      addMsg("error", "error", `${ev.error_type ?? ""}: ${ev.message ?? JSON.stringify(ev)}`);
      break;
  }
}

function updateCost() {
  const c = JSON.parse(agent.costSnapshot());
  const rows = [
    ["input tokens", c.totalInputTokens], ["output tokens", c.totalOutputTokens],
    ["cache read", c.totalCacheReadTokens], ["cache write", c.totalCacheWriteTokens],
    ["reasoning", c.totalReasoningTokens], ["provider calls", c.providerCalls],
  ];
  $("cost").innerHTML = rows.map(([k, v]) =>
    `<tr><td>${k}</td><td class="costcell">${v ?? 0}</td></tr>`).join("");
}

// ---------- wiring ----------
$("mode").onchange = () => { $("openai-box").style.display = $("mode").value === "openai" ? "" : "none"; };

function ensureAgent() {
  if (!agent) agent = makeAgent();
  return agent;
}

$("inputbar").onsubmit = (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = "";
  ensureAgent();
  addMsg("user", "you", text);
  agent.prompt(text);
  pump();
};
$("input").onkeydown = (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("inputbar").requestSubmit(); }
};

$("export").onclick = () => {
  const blob = new Blob([agent ? agent.exportSession() : '{"v":1,"history":[]}'], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "senza-session.json"; a.click();
};
$("import").onclick = async () => {
  const f = document.createElement("input"); f.type = "file"; f.accept = ".json";
  f.onchange = async () => {
    const text = await f.files[0].text();
    ensureAgent().importSession(text);
    addMsg("assistant", "system", `已导入 ${JSON.parse(text).history.length} 条历史。`);
  };
  f.click();
};
$("clear").onclick = () => { if (agent) { agent.clearSession(); addMsg("assistant", "system", "会话已清空（成本累计保留）。"); } };

addMsg("assistant", "system",
  '已就绪。默认 mock 剧本：模型会调 fetchTime（自动执行）、调 writeNote（弹审批）、然后收尾文字。\n试试输入任意内容，或切到 openai 模式接真模型。');
</script>
</body>
</html>
