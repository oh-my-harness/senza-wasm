<!doctype html>
<!-- demo/index.html — 入口页：选一个 demo 去玩。API 配一次（localStorage），全组共享。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>senza-wasm demos</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; background: #0a0d14; color: #e8ebf0;
    font: 15px/1.6 -apple-system, "PingFang SC", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 48px 24px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  h1 small { color: #7d8590; font-weight: normal; font-size: 14px; }
  .sub { color: #7d8590; font-size: 13px; margin-bottom: 36px; }
  #cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 380px));
    gap: 20px; width: 100%; max-width: 820px; }
  a.card { display: block; text-decoration: none; color: inherit;
    background: linear-gradient(160deg, #161a23, #11141c);
    border: 1px solid #262b36; border-radius: 16px; padding: 22px 24px;
    transition: transform .18s, border-color .18s; }
  a.card:hover { transform: translateY(-3px); border-color: #3d5a99; }
  .card .emoji { font-size: 30px; }
  .card h2 { font-size: 17px; margin: 10px 0 6px; }
  .card p { font-size: 13px; color: #9aa3b0; }
  .card .tags { margin-top: 14px; display: flex; gap: 6px; flex-wrap: wrap; }
  .card .tag { font-size: 11px; color: #8ab4f8; background: rgba(138,180,248,.12);
    border-radius: 5px; padding: 2px 8px; }
  #cfgstate { margin-top: 40px; font-size: 13px; color: #7d8590; }
  #cfgstate b { color: #9fc7a4; font-weight: 600; }
</style>
</head>
<body>
<h1>senza-wasm <small>· browser agent demos</small></h1>
<p class="sub">完整 agent loop 跑在你浏览器里的 wasm 上 —— 服务器只递送静态文件</p>

<div id="cards">
  <a class="card" href="chat.html">
    <div class="emoji">💬</div>
    <h2>聊天助手</h2>
    <p>多轮对话 + 工具调用 + 审批门：模型想写 localStorage 时弹「放行 / 拒绝」，
    拒绝对模型可见。带成本快照和 session 导出导入。</p>
    <div class="tags"><span class="tag">多轮</span><span class="tag">工具</span><span class="tag">审批门</span><span class="tag">costSnapshot</span></div>
  </a>
  <a class="card" href="vale.html">
    <div class="emoji">🌿</div>
    <h2>Agent Vale</h2>
    <p>在草地世界里走动，和「建筑师」精灵对话：种树、下雨、转午夜、生成动物 ——
    9 个世界工具实时改写游戏世界，渲染永不阻塞。</p>
    <div class="tags"><span class="tag">游戏宿主</span><span class="tag">9 工具</span><span class="tag">流式回复</span><span class="tag">60FPS</span></div>
  </a>
</div>

<p id="cfgstate"></p>

<script type="module">
import { loadCfg } from "./common.js";
const cfg = loadCfg();
const el = document.getElementById("cfgstate");
if (cfg.apiKey || (cfg.baseUrl || "").includes("localhost"))
  el.innerHTML = `API 已配置（<b>${cfg.model || "gpt-4o-mini"}</b> @ ${cfg.baseUrl || "官方端点"}）—— 直接开玩；换配置进任一 demo 的 ⚙ 设置`;
else
  el.textContent = "还没配置 API：进入任一 demo 点右上角 ⚙ 填一次（key 只存你浏览器 localStorage）";
</script>
</body>
</html>
